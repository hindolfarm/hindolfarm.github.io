<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>흰베리 모바일 미리보기</title><style>*{box-sizing:border-box}body{margin:0;background:#202723;color:#f4ead7;font:15px Arial,sans-serif}header{position:sticky;top:0;z-index:3;background:#102d22;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0 18px 0 0}button,a{border:1px solid #cdb67e;background:transparent;color:#f4ead7;padding:9px 12px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:13px}button.on{background:#e5c98d;color:#12362a}main{padding:22px 8px 45px;display:flex;justify-content:center}.phone{width:390px;max-width:100%;background:white;border:9px solid #111;border-radius:30px;overflow:hidden;box-shadow:0 20px 50px #0007;transition:width .2s}.phone iframe{display:block;border:0;width:100%;height:78vh;min-height:600px;background:white}.hint{text-align:center;color:#c6c5b9;font-size:12px;padding:0 15px 25px}</style></head><body><header><h1>HIN BERRY · 모바일 확인</h1><button onclick="setWidth(375,this)" class="on">아이폰 375px</button><button onclick="setWidth(390,this)">390px</button><button onclick="setWidth(430,this)">큰 휴대폰 430px</button><a href="index.html" target="_blank">홈페이지 원본 열기</a></header><main><div class="phone" id="phone" style="width:375px"><iframe src="index.html" title="흰베리 홈페이지 모바일 미리보기"></iframe></div></main><p class="hint">휴대폰 모형 안에서 스크롤하여 전체 페이지를 확인하세요. 이 파일은 원본 홈페이지를 수정하지 않습니다.</p><script>function setWidth(w,b){document.getElementById('phone').style.width=w+'px';document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}</script></body></html>
